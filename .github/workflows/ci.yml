name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # === ШАГ 1: ЛИНТЕРЫ (Блокируют сборку, если код грязный) ===
  lint-backend:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend
      - name: Run ESLint
        run: npm run lint
        working-directory: ./frontend

  # === ШАГ 2: СБОРКА ПРИЛОЖЕНИЯ ===
  build:
    name: Build App
    needs: [lint-backend, lint-frontend] # Ждем, пока линтеры пройдут успешно
    strategy:
      fail-fast: false # Если одна ОС упадет, остальные дособираются
      matrix:
        build:
          - os: windows-latest
            platform: windows/amd64
            output_name: my-wails-app.exe
          - os: ubuntu-latest
            platform: linux/amd64
            output_name: my-wails-app
    
    runs-on: ${{ matrix.build.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Системные зависимости для сборки под Linux (для Windows и Mac это не нужно)
      - name: Install Linux Dependencies
        if: matrix.build.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev build-essential

      # Установка Wails CLI внутри виртуальной машины GitHub
      - name: Install Wails CLI
        run: go install ://github.com

      # Сама команда сборки Wails. Она автоматически соберет фронтенд и упакует в Go
      - name: Build Application
        run: wails build -platform ${{ matrix.build.platform }} -clean

      # Сохранение готового файла в артефакты сборки GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-${{ matrix.build.os }}
          path: build/bin/${{ matrix.build.output_name }}
